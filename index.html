<!DOCTYPE html>
<html>
    <head>
        <title>Self Driving Car</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <canvas id="carCanvas"></canvas>
        <div id="verticalButtons">
            <button onclick="save()">Save</button>
            <button onclick="discard()">Delete</button>
            <button onclick="clearStats()" title="Clear generation history">Clear Stats</button>
            <button onclick="downloadBrain()" title="Download brain weights as JSON">Export</button>
            <button onclick="document.getElementById('brainUpload').click()" title="Load brain weights from JSON file">Import</button>
            <input type="file" id="brainUpload" accept=".json" style="display:none" onchange="loadBrainFromFile(event)"/>
            <div id="mutationControl">
                <label for="mutationRate">Mutation</label>
                <input type="range" id="mutationRate" min="0" max="1" step="0.01" value="0.1"
                    oninput="document.getElementById('mutationValue').textContent=parseFloat(this.value).toFixed(2)"/>
                <span id="mutationValue">0.10</span>
            </div>
            <div id="populationControl">
                <label for="populationSize">Population</label>
                <input type="range" id="populationSize" min="20" max="200" step="10" value="100"
                    oninput="document.getElementById('popValue').textContent=this.value; onPopulationChange()"/>
                <span id="popValue">100</span>
            </div>
            <div id="presetControl">
                <label>Presets</label>
                <button onclick="applyPreset('explore')" title="N=150, mutation=0.40 — wide search, more chaos">Explore</button>
                <button onclick="applyPreset('balanced')" title="N=80, mutation=0.15 — default tradeoff">Balanced</button>
                <button onclick="applyPreset('exploit')" title="N=40, mutation=0.05 — refine current brain">Exploit</button>
                <div id="customPresetList"></div>
                <button onclick="saveCustomPreset()" title="Save the current population + mutation sliders as a named preset">+ Save Custom</button>
            </div>
            <button onclick="restartSim()" title="Respawn cars with current mutation rate">Restart</button>
        </div>
        <canvas id="networkCanvas"></canvas>
        <script src="visualizer.js"></script>
        <script src="network.js"></script>
        <script src="sensor.js"></script>
        <script src="utils.js"></script>
        <script src="road.js"></script>
        <script src="controls.js"></script>
        <script src="car.js"></script>
        <script src="stats.js"></script>
        <script src="main.js"></script>
    </body>
</html>
